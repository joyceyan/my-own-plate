name: MyOwnPlate
options:
  bundleIdPrefix: com.myownplate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  llama-swift:
    url: https://github.com/mattt/llama.swift
    from: "2.9999.0"

targets:
  MyOwnPlate:
    type: application
    platform: iOS
    sources:
      - path: MyOwnPlate
        excludes:
          - Resources/Info.plist
          - Resources/Model
          - Resources/GGUFModels
      - path: MyOwnPlate/Resources/GGUFModels
        type: folder
        buildPhase: resources
    info:
      path: MyOwnPlate/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "MyOwnPlate needs camera access to photograph your food for nutritional analysis."
        NSPhotoLibraryUsageDescription: "MyOwnPlate needs photo library access so you can select food photos for nutritional analysis."
        UILaunchScreen:
          UIColorName: ""
    dependencies:
      - package: llama-swift
        product: LlamaSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myownplate.app
        DEVELOPMENT_TEAM: "SZ6N64JQG8"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
