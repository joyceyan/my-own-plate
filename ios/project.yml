name: MyOwnPlate
options:
  bundleIdPrefix: com.myownplate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: "3.31.3"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.31.3"
  superwall-ios:
    url: https://github.com/superwall/Superwall-iOS
    from: "4.16.1"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  MyOwnPlate:
    type: application
    platform: iOS
    sources:
      - path: MyOwnPlate
        excludes:
          - Resources/Info.plist
          - Resources/Model
          - Services/RunAnywhereModelService.swift
    resources:
      - path: MyOwnPlate/Resources/Model
        buildPhase: resources
    info:
      path: MyOwnPlate/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "MyOwnPlate needs camera access to photograph your food for nutritional analysis."
        NSPhotoLibraryUsageDescription: "MyOwnPlate needs photo library access so you can select food photos for nutritional analysis."
        UILaunchScreen:
          UIColorName: ""
    dependencies:
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXRandom
      - package: superwall-ios
        product: SuperwallKit
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myownplate.app
        DEVELOPMENT_TEAM: "SZ6N64JQG8"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
